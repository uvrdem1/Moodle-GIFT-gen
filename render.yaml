services:
  - type: web
    name: moodle-gift-gen-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: python manage.py migrate && gunicorn backend.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: moodle-gift-gen-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://moodle-gift-gen-api.onrender.com
      - key: GIGACHAT_VERIFY_SSL
        value: False
      - key: GIGACHAT_AUTH_KEY
        sync: false
